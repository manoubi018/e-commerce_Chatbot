<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot FAQ & Commandes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #0a0817;
    --bg-2: #1a1333;
    --bg-3: #0d0f2b;
    --accent: #8b5cf6;
    --accent-2: #22d3ee;
    --accent-3: #34d399;
    --bubble-user: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
    --bubble-bot: rgba(255, 255, 255, 0.045);
    --text: #f5f3ff;
    --text-dim: #9a94b8;
    --text-faint: #6b6690;
    --danger: #fb7185;
    --radius-lg: 22px;
    --radius-md: 16px;
    --ease-spring: cubic-bezier(.16, 1, .3, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    position: relative;
    background: var(--bg-1);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    overflow: hidden;
  }

  /* fond : mesh de dégradés animés, façon aurore */
  .aura {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .aura span {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    mix-blend-mode: screen;
  }
  .aura span:nth-child(1) {
    width: 520px; height: 520px;
    background: radial-gradient(circle, var(--accent), transparent 70%);
    top: -10%; left: -8%;
    animation: float1 22s ease-in-out infinite;
  }
  .aura span:nth-child(2) {
    width: 460px; height: 460px;
    background: radial-gradient(circle, var(--accent-2), transparent 70%);
    bottom: -12%; right: -6%;
    animation: float2 26s ease-in-out infinite;
  }
  .aura span:nth-child(3) {
    width: 380px; height: 380px;
    background: radial-gradient(circle, var(--accent-3), transparent 70%);
    top: 40%; left: 60%;
    opacity: 0.3;
    animation: float3 30s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(60px, 80px) scale(1.15); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-70px, -50px) scale(1.1); }
  }
  @keyframes float3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-40px, 40px) scale(0.9); }
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 760px;
    height: 90vh;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
    backdrop-filter: blur(28px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 28px;
    box-shadow:
      0 30px 80px -20px rgba(0, 0, 0, 0.65),
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 1px 0 rgba(255,255,255,0.12) inset;
    overflow: hidden;
    animation: riseIn 0.6s var(--ease-spring);
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(30px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  header {
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    background: rgba(255, 255, 255, 0.02);
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 6px 20px -4px rgba(139, 92, 246, 0.6);
    position: relative;
  }
  .avatar::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 16px;
    border: 1px solid rgba(139, 92, 246, 0.4);
    animation: ringPulse 2.8s ease-out infinite;
  }

  @keyframes ringPulse {
    0% { opacity: 0.8; transform: scale(0.92); }
    80% { opacity: 0; transform: scale(1.25); }
    100% { opacity: 0; transform: scale(1.25); }
  }

  header .title-block { display: flex; flex-direction: column; gap: 3px; }

  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  header .status {
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--danger);
    box-shadow: 0 0 8px var(--danger);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .dot.online { background: var(--accent-3); box-shadow: 0 0 8px var(--accent-3); }

  .setup-toggle {
    margin-left: auto;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 12px;
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s var(--ease-spring), transform 0.2s var(--ease-spring), border-color 0.2s ease;
  }
  .setup-toggle:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-1px); border-color: rgba(255,255,255,0.2); }
  .setup-toggle:active { transform: translateY(0) scale(0.97); }

  .setup-panel {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.4s var(--ease-spring);
    background: rgba(0, 0, 0, 0.22);
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }
  .setup-panel.open { grid-template-rows: 1fr; }
  .setup-panel > div { overflow: hidden; }
  .setup-panel-inner { padding: 0 24px; transition: padding 0.4s var(--ease-spring); }
  .setup-panel.open .setup-panel-inner { padding: 18px 24px; }

  .setup-panel .row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }

  .setup-panel input {
    flex: 1;
    background: rgba(255, 255, 255, 0.055);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--text);
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .setup-panel input:focus {
    border-color: var(--accent);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18);
  }
  .setup-panel input::placeholder { color: var(--text-faint); }

  .setup-panel button {
    background: linear-gradient(135deg, var(--accent), #6d28d9);
    border: none;
    color: white;
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.18s var(--ease-spring), filter 0.2s ease, box-shadow 0.2s ease;
    white-space: nowrap;
    box-shadow: 0 4px 14px -4px rgba(139, 92, 246, 0.6);
  }
  .setup-panel button:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
  .setup-panel button:active:not(:disabled) { transform: translateY(0) scale(0.96); }
  .setup-panel button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .setup-hint {
    font-size: 11.5px;
    color: var(--text-faint);
    line-height: 1.6;
  }

  .token-preview {
    margin-top: 10px;
    font-size: 11px;
    color: var(--accent-3);
    word-break: break-all;
    font-family: 'JetBrains Mono', monospace;
    min-height: 14px;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 26px 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 5px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 6px; }
  .messages::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    color: var(--text-faint);
    padding: 30px;
  }
  .empty-state .icon {
    width: 64px; height: 64px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(139,92,246,0.18), rgba(34,211,238,0.12));
    border: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    margin-bottom: 6px;
    animation: floatIcon 4s ease-in-out infinite;
  }
  @keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .empty-state h2 { font-size: 15px; color: var(--text); margin: 0; font-weight: 700; }
  .empty-state p { font-size: 13px; margin: 0; max-width: 320px; line-height: 1.6; }

  .msg-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    margin: 8px 0;
    animation: bubbleIn 0.45s var(--ease-spring);
  }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-row.error { justify-content: center; }

  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(14px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .msg-avatar {
    width: 28px; height: 28px;
    border-radius: 9px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .msg-row.bot .msg-avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .msg-row.user .msg-avatar { background: rgba(255,255,255,0.08); }

  .msg-inner {
    display: flex;
    flex-direction: column;
    max-width: 74%;
  }
  .msg-row.user .msg-inner { align-items: flex-end; }
  .msg-row.bot .msg-inner { align-items: flex-start; }

  .msg {
    padding: 13px 17px;
    border-radius: var(--radius-lg);
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,0.4);
    transition: transform 0.15s ease;
  }

  .msg-row.user .msg {
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 6px;
  }

  .msg-row.bot .msg {
    background: var(--bubble-bot);
    color: var(--text);
    border-bottom-left-radius: 6px;
    border: 1px solid rgba(255,255,255,0.07);
  }

  .msg-row.error .msg {
    background: rgba(251, 113, 133, 0.12);
    border: 1px solid rgba(251, 113, 133, 0.35);
    color: #ffc2cc;
    font-size: 12.5px;
    text-align: center;
    border-radius: var(--radius-md);
  }

  .msg-time {
    font-size: 10.5px;
    color: var(--text-faint);
    margin-top: 5px;
    padding: 0 4px;
    font-variant-numeric: tabular-nums;
  }

  .typing-row { display: flex; gap: 10px; align-items: flex-end; margin: 8px 0; animation: bubbleIn 0.3s var(--ease-spring); }

  .typing {
    display: flex;
    gap: 5px;
    padding: 15px 18px;
    background: var(--bubble-bot);
    border-radius: var(--radius-lg);
    border-bottom-left-radius: 6px;
    border: 1px solid rgba(255,255,255,0.07);
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-2);
    animation: bounce 1.3s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-7px); opacity: 1; }
  }

  form.composer {
    display: flex;
    gap: 10px;
    padding: 18px 22px;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
    background: rgba(255, 255, 255, 0.02);
    align-items: center;
  }

  .composer input {
    flex: 1;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text);
    padding: 14px 18px;
    border-radius: 16px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.25s ease;
  }
  .composer input:focus {
    border-color: var(--accent);
    background: rgba(255,255,255,0.09);
    box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
  }
  .composer input::placeholder { color: var(--text-faint); }

  .composer button {
    width: 48px;
    height: 48px;
    border-radius: 15px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s var(--ease-spring), filter 0.2s ease, box-shadow 0.2s ease;
    flex-shrink: 0;
    box-shadow: 0 8px 20px -6px rgba(139, 92, 246, 0.65);
  }
  .composer button svg { width: 18px; height: 18px; transition: transform 0.2s var(--ease-spring); }
  .composer button:hover:not(:disabled) { transform: translateY(-2px) scale(1.04); filter: brightness(1.12); }
  .composer button:active:not(:disabled) svg { transform: translateX(2px) rotate(8deg); }
  .composer button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
</style>
</head>
<body>

<div class="aura"><span></span><span></span><span></span></div>

<div class="app">
  <header>
    <div class="avatar">✦</div>
    <div class="title-block">
      <h1>Assistant FAQ &amp; Commandes</h1>
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Non connecté</span></div>
    </div>
    <button class="setup-toggle" id="setupToggle">⚙︎ Session de test</button>
  </header>

  <div class="setup-panel" id="setupPanel">
    <div>
      <div class="setup-panel-inner">
        <div class="row">
          <input type="text" id="userIdInput" placeholder="user_id (ex: 1)">
          <input type="text" id="businessIdInput" placeholder="business_id (ex: 1)">
          <button id="generateBtn">Générer</button>
        </div>
        <div class="setup-hint">
          Crée une session de test (dev only) et récupère un token automatiquement — inutile de passer par Postman/SQL.
        </div>
        <div class="token-preview" id="tokenPreview"></div>
      </div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="icon">💬</div>
      <h2>Commencez la conversation</h2>
      <p>Posez une question sur une entreprise ou vos commandes — je m'occupe du reste.</p>
    </div>
  </div>

  <form class="composer" id="composer">
    <input type="text" id="messageInput" placeholder="Écrivez votre message..." autocomplete="off">
    <button type="submit" id="sendBtn" aria-label="Envoyer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const emptyState = document.getElementById('emptyState');
  const composer = document.getElementById('composer');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const setupToggle = document.getElementById('setupToggle');
  const setupPanel = document.getElementById('setupPanel');
  const generateBtn = document.getElementById('generateBtn');
  const userIdInput = document.getElementById('userIdInput');
  const businessIdInput = document.getElementById('businessIdInput');
  const tokenPreview = document.getElementById('tokenPreview');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  const AVATARS = { bot: '✦', user: '🙂' };

  let token = localStorage.getItem('chatbot_token') || '';
  let sessionId = localStorage.getItem('chatbot_session_id') || null;

  function updateStatus() {
    if (token) {
      statusDot.classList.add('online');
      statusText.textContent = 'Session active';
    } else {
      statusDot.classList.remove('online');
      statusText.textContent = 'Non connecté';
    }
  }
  updateStatus();

  setupToggle.addEventListener('click', () => {
    setupPanel.classList.toggle('open');
  });

  if (!token) setupPanel.classList.add('open');

  let history = JSON.parse(localStorage.getItem('chatbot_history') || '[]');

  function hideEmptyState() {
    if (emptyState) emptyState.style.display = 'none';
  }

  function formatTime() {
    return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  function renderMessage(text, role, time, products) {
    hideEmptyState();

    const row = document.createElement('div');
    row.className = 'msg-row ' + role;

    if (role !== 'error') {
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = AVATARS[role] || '•';
      row.appendChild(avatar);
    }

    const inner = document.createElement('div');
    inner.className = 'msg-inner';

    // Affiche les tuiles produits si on a des données produits ET que le message
    // est un listing de produits (catalogue complet ou suggestion par idée)
    const isProductListing = text.includes('Produits proposés par')
      || text.includes('correspondent à votre idée');
    const showProducts = products && products.length > 0 && isProductListing;

    if (showProducts) {
      // Titre = première ligne du message (avant la grille)
      const titleBubble = document.createElement('div');
      titleBubble.className = 'msg';
      titleBubble.textContent = text.split('\n')[0];
      inner.appendChild(titleBubble);

      // Grille de tuiles
      const grid = document.createElement('div');
      grid.style.marginTop = '12px';
      grid.style.display = 'grid';
      grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(140px, 1fr))';
      grid.style.gap = '12px';
      grid.style.width = '100%';

      products.forEach((p, idx) => {
        const card = document.createElement('div');
        card.style.background = 'rgba(255,255,255,0.04)';
        card.style.borderRadius = '14px';
        card.style.border = '1px solid rgba(255,255,255,0.1)';
        card.style.overflow = 'hidden';
        card.style.cursor = 'pointer';
        card.style.transition = 'all 0.2s ease';
        card.onmouseenter = () => {
          card.style.borderColor = 'rgba(139,92,246,0.6)';
          card.style.transform = 'translateY(-3px)';
        };
        card.onmouseleave = () => {
          card.style.borderColor = 'rgba(255,255,255,0.1)';
          card.style.transform = 'translateY(0)';
        };

        // Zone image
        const imgBox = document.createElement('div');
        imgBox.style.width = '100%';
        imgBox.style.height = '130px';
        imgBox.style.background = 'linear-gradient(135deg, rgba(139,92,246,0.25), rgba(34,211,238,0.15))';
        imgBox.style.display = 'flex';
        imgBox.style.alignItems = 'center';
        imgBox.style.justifyContent = 'center';
        imgBox.style.fontSize = '32px';

        if (p.image && p.image.trim()) {
          const img = document.createElement('img');
          img.src = p.image;
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.objectFit = 'cover';
          // Si l'image ne charge pas, affiche une icône
          img.onerror = () => {
            imgBox.removeChild(img);
            imgBox.textContent = '🛍️';
          };
          imgBox.appendChild(img);
        } else {
          imgBox.textContent = '🛍️';
        }
        card.appendChild(imgBox);

        // Infos
        const info = document.createElement('div');
        info.style.padding = '10px 12px';

        const name = document.createElement('div');
        name.style.fontWeight = '600';
        name.style.fontSize = '12.5px';
        name.style.color = 'var(--text)';
        name.style.marginBottom = '6px';
        name.style.lineHeight = '1.35';
        name.textContent = `${idx + 1}. ${p.nom}`;
        info.appendChild(name);

        const price = document.createElement('div');
        price.style.fontSize = '13px';
        price.style.fontWeight = '700';
        price.style.color = 'var(--accent-3)';
        price.textContent = `${p.prix} TND`;
        info.appendChild(price);

        // nom de l'entreprise (utile quand les produits viennent de plusieurs sociétés)
        if (p.business) {
          const biz = document.createElement('div');
          biz.style.fontSize = '11px';
          biz.style.color = 'var(--text-faint)';
          biz.style.marginTop = '4px';
          biz.textContent = `🏢 ${p.business}`;
          info.appendChild(biz);
        }

        card.appendChild(info);
        grid.appendChild(card);
      });

      inner.appendChild(grid);

      // Question finale (tout ce qui suit la grille)
      const questionMatch = text.match(/Voulez-vous[\s\S]*$/);
      if (questionMatch) {
        const qBubble = document.createElement('div');
        qBubble.className = 'msg';
        qBubble.style.marginTop = '12px';
        qBubble.textContent = questionMatch[0].trim();
        inner.appendChild(qBubble);
      }

    } else {
      // Message texte normal
      const bubble = document.createElement('div');
      bubble.className = 'msg';
      bubble.textContent = text;
      inner.appendChild(bubble);
    }

    if (role !== 'error') {
      const timeEl = document.createElement('div');
      timeEl.className = 'msg-time';
      timeEl.textContent = time || formatTime();
      inner.appendChild(timeEl);
    }

    row.appendChild(inner);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function addMessage(text, role, products) {
    const time = formatTime();
    const row = renderMessage(text, role, time, products);
    history.push({ text, role, time, products });
    localStorage.setItem('chatbot_history', JSON.stringify(history));
    return row;
  }

  function clearHistory() {
    history = [];
    localStorage.removeItem('chatbot_history');
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyState);
    emptyState.style.display = 'flex';
  }

  // rejoue les messages sauvegardés au chargement de la page
  history.forEach(m => renderMessage(m.text, m.role, m.time, m.products));

  function showTyping() {
    hideEmptyState();
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typingIndicator';
    row.innerHTML =
      '<div class="msg-avatar">' + AVATARS.bot + '</div>' +
      '<div class="typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  generateBtn.addEventListener('click', async () => {
    const userId = userIdInput.value.trim();
    const businessId = businessIdInput.value.trim();

    if (!userId || !businessId) {
      tokenPreview.textContent = 'Renseigne user_id et business_id.';
      tokenPreview.style.color = '#ffb3c0';
      return;
    }

    generateBtn.disabled = true;
    generateBtn.textContent = '...';

    try {
      const res = await fetch('/dev/create-test-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId, business_id: businessId })
      });
      const data = await res.json();

      if (!res.ok) {
        tokenPreview.style.color = '#ffb3c0';
        tokenPreview.textContent = 'Erreur : ' + (data.error || 'inconnue');
      } else {
        token = data.token;
        localStorage.setItem('chatbot_token', token);
        sessionId = null;
        localStorage.removeItem('chatbot_session_id');
        clearHistory();
        tokenPreview.style.color = '#34d399';
        tokenPreview.textContent = 'Token généré et activé ✓';
        updateStatus();
        setTimeout(() => setupPanel.classList.remove('open'), 900);
      }
    } catch (err) {
      tokenPreview.style.color = '#ffb3c0';
      tokenPreview.textContent = 'Erreur réseau : ' + err.message;
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = 'Générer';
    }
  });

  composer.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!text) return;

    if (!token) {
      addMessage("Aucune session active — génère d'abord un token via le panneau ⚙︎ Session de test.", 'error');
      return;
    }

    addMessage(text, 'user');
    messageInput.value = '';
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });

      const data = await res.json();
      hideTyping();

      if (!res.ok) {
        addMessage(data.error || 'Erreur inconnue.', 'error');
        return;
      }

      sessionId = data.session_id;
      localStorage.setItem('chatbot_session_id', sessionId);
      console.log('Réponse du serveur:', data);
      console.log('Produits reçus:', data.products);
      addMessage(data.response, 'bot', data.products || null);

    } catch (err) {
      hideTyping();
      addMessage('Erreur réseau : ' + err.message, 'error');
    } finally {
      sendBtn.disabled = false;
      messageInput.focus();
    }
  });
</script>

</body>
</html>
