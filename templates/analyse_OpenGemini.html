<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analyse IA Produits - Gemini vs OpenAI</title>

    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
        background: #f4f7f6;
        color: #333;
      }

      .container {
        background: white;
        padding: 30px;
        border-radius: 12px;
      }

      h2 {
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 10px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .box {
        background: #f8fafc;
        padding: 15px;
        border-radius: 10px;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        margin-top: 5px;
      }

      textarea {
        height: 110px;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 15px;
        font-weight: bold;
      }

      #json_details {
        height: 180px;
        background: #0f172a;
        color: #38bdf8;
        font-family: monospace;
      }

      .title {
        font-weight: bold;
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Analyse IA Produits (Gemini vs OpenAI)</h2>

      <input type="file" id="fileInput" accept="image/*" />

      <button onclick="sendData()">Analyser l'image</button>

      <div class="grid">
        <!-- GEMINI -->
        <div class="box">
          <div class="title">Gemini</div>
          <input id="g_name" placeholder="Nom produit" readonly />
          <input id="g_cat" placeholder="Catégorie" readonly />
          <textarea id="g_desc" placeholder="Description" readonly></textarea>
        </div>

        <!-- OPENAI -->
        <div class="box">
          <div class="title">OpenAI</div>
          <input id="o_name" placeholder="Nom produit" readonly />
          <input id="o_cat" placeholder="Catégorie" readonly />
          <textarea id="o_desc" placeholder="Description" readonly></textarea>
        </div>
      </div>

      <!-- BEST -->
      <div class="box">
        <div class="title">Résultat final (Best - backend)</div>
        <input id="b_name" placeholder="Nom produit" readonly />
        <input id="b_cat" placeholder="Catégorie" readonly />
        <textarea id="b_desc" placeholder="Description" readonly></textarea>
      </div>

      <!-- BEST MODEL -->
      <div class="box">
        <div class="title">Modèle sélectionné</div>
        <input id="best_model" readonly />
      </div>

      <!-- JSON INTERNE -->
      <div class="box">
        <div class="title">JSON interne (détails techniques)</div>
        <textarea id="json_details" readonly></textarea>
      </div>
    </div>

    <script>
      async function sendData() {
        const file = document.getElementById("fileInput").files[0];
        if (!file) return alert("Ajoute une image");

        const formData = new FormData();
        formData.append("file", file);

        const res = await fetch("/analyze", {
          method: "POST",
          body: formData,
        });

        const data = await res.json();

        const results = data.benchmarks || [];

        const gemini =
          results.find((r) => r.provider === "gemini")?.output || {};

        const openai =
          results.find((r) => r.provider === "openai")?.output || {};

        const best = data.visible || {};

        // =====================
        // GEMINI
        // =====================
        document.getElementById("g_name").value = gemini.nom_produit || "";
        document.getElementById("g_cat").value = gemini.categorie || "";
        document.getElementById("g_desc").value =
          gemini.description_marketing || "";

        // =====================
        // OPENAI
        // =====================
        document.getElementById("o_name").value = openai.nom_produit || "";
        document.getElementById("o_cat").value = openai.categorie || "";
        document.getElementById("o_desc").value =
          openai.description_marketing || "";

        // =====================
        // BEST RESULT
        // =====================
        document.getElementById("b_name").value = best.nom_produit || "";
        document.getElementById("b_cat").value = best.categorie || "";
        document.getElementById("b_desc").value =
          best.description_marketing || "";

        // =====================
        // MODEL CHOISI
        // =====================
        document.getElementById("best_model").value = data.best_model || "";

        // =====================
        // JSON INTERNE
        // =====================
        document.getElementById("json_details").value = JSON.stringify(
          data.internal || {},
          null,
          2,
        );
      }
    </script>
  </body>
</html>
